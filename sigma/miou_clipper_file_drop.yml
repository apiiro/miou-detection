title: Msedgeview.dll Written Under LocalAppData EdgeWebView (MIOU Clipper Drop)
id: 21124f52-280d-4c3e-8ea0-a90d3dab588e
status: experimental
description: Detects the MIOU loader dropping its clipboard hijacker as a hidden file named like a WebView2 component. Real WebView2 does not ship msedgeview.dll.
author: Shmulik Cohen (Apiiro)
date: 2026-11-17
tags:
    - attack.persistence
    - attack.t1546.015
logsource:
    category: file_event
    product: windows
detection:
    selection:
        TargetFilename|contains: '\AppData\Local\Microsoft\EdgeWebView\'
        TargetFilename|endswith: '\msedgeview.dll'
    condition: selection
falsepositives:
    - Unknown
level: high
